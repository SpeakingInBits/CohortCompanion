name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CohortCompanion.slnx

      - name: Build
        run: dotnet build CohortCompanion.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test CohortCompanion.slnx --no-build --configuration Release

      - name: Check the Azure infrastructure compiles
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
